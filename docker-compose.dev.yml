version: "3.9"

name: esign-dev

services:

  # PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: esign-postgres-dev
    environment:
      POSTGRES_USER: developer
      POSTGRES_PASSWORD: rahasia
      POSTGRES_DB: esign-db
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - esign-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U developer -d esign-db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # RabbitMQ
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: esign-rabbitmq-dev
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # Management UI
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - esign-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  esign-network:
    driver: bridge
    name: esign-network-dev

volumes:
  postgres-data:
    name: esign-postgres-data
  rabbitmq-data:
    name: esign-rabbitmq-data